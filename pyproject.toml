[project]
name = "thesaurus-based-ner"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Takayoshi Shibahara", email = "fractal.civilization@gmail.com" }
]
dependencies = [
    "dartsclone>=0.10.2",
    "dvc>=3.59.1",
    "more-itertools>=10.6.0",
    "inflection>=0.5.1",
    "datasets>=3.4.0",
    "anytree>=2.12.1",
    "seqeval>=1.2.2",
    "prettytable>=3.15.1",
    "rdflib>=7.1.3",
    "mlflow>=2.21.0",
    "transformers==4.33.1",
    "torch>=2.6.0",
    "loguru>=0.7.3",
    "flashtext>=2.7",
    "p-tqdm>=1.4.2",
    "benepar>=0.2.0",
    "scispacy>=0.5.5",
    "en-core-sci-sm @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz",
    "numpy==1.26.4",
    "hydra-core==1.3.2",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1.tar.gz",
    "fire>=0.7.0",
    "ipython>=8.18.1",
]

readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/thesaurus_based_ner"]

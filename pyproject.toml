[project]
name = "thesaurus-based-ner"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Takayoshi Shibahara", email = "fractal.civilization@gmail.com" }
]
dependencies = [
    "dartsclone>=0.10.2",
    "dvc>=3.59.1",
]
readme = "README.md"

[project]
name = "thesaurus-based-ner"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Takayoshi Shibahara", email = "fractal.civilization@gmail.com" }
]
dependencies = [
    "dartsclone>=0.10.2",
    "dvc>=3.59.1",
    "more-itertools>=10.6.0",
    "inflection>=0.5.1",
    "datasets>=3.4.0",
    "anytree>=2.12.1",
    "seqeval>=1.2.2",
    "prettytable>=3.15.1",
    "rdflib>=7.1.3",
]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/thesaurus_based_ner"]
